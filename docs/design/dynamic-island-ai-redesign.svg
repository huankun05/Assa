<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" font-family="'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif">
  <!-- 背景：浅色渐变模拟桌面 -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e2e6ec"/>
    </linearGradient>
    <linearGradient id="glassSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.92)"/>
      <stop offset="100%" stop-color="rgba(245,247,250,.88)"/>
    </linearGradient>
    <linearGradient id="darkGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(28,32,40,.92)"/>
      <stop offset="100%" stop-color="rgba(18,22,30,.94)"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#409cff"/>
      <stop offset="100%" stop-color="#2f7fe6"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(64,156,255,.35)"/>
      <stop offset="100%" stop-color="rgba(64,156,255,0)"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="12" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 像素小恐龙模板（AI 吉祥物） -->
    <symbol id="pixelDino" viewBox="0 0 1100 1100">
      <!-- 身体主体 (浅橙) -->
      <!-- 头 + 身体一个整体块（圆头小恐龙） -->
      <g shape-rendering="crispEdges">
        <!-- 头背鳍（橙色阶梯） -->
        <rect x="430" y="135" width="80" height="40" fill="#E89540"/>
        <rect x="510" y="175" width="60" height="40" fill="#E89540"/>
        <!-- 头主体（不规则椭圆，简化用阶梯块） -->
        <rect x="240" y="215" width="620" height="80" fill="#F8B66E"/>
        <rect x="200" y="295" width="700" height="80" fill="#F8B66E"/>
        <rect x="180" y="375" width="740" height="80" fill="#F8B66E"/>
        <rect x="170" y="455" width="760" height="80" fill="#F8B66E"/>
        <rect x="170" y="535" width="760" height="80" fill="#F8B66E"/>
        <rect x="180" y="615" width="740" height="60" fill="#F8B66E"/>
        <rect x="200" y="675" width="240" height="60" fill="#F8B66E"/>
        <rect x="700" y="675" width="220" height="60" fill="#F8B66E"/>
        <rect x="220" y="735" width="160" height="60" fill="#F8B66E"/>
        <rect x="740" y="735" width="160" height="60" fill="#F8B66E"/>
        <rect x="240" y="795" width="120" height="60" fill="#F8B66E"/>
        <rect x="780" y="795" width="80" height="60" fill="#F8B66E"/>
        <!-- 尾巴（左下阶梯） -->
        <rect x="60" y="775" width="120" height="60" fill="#F8B66E"/>
        <rect x="20" y="835" width="120" height="60" fill="#F8B66E"/>
        <rect x="100" y="895" width="120" height="40" fill="#F8B66E"/>
        <rect x="20" y="935" width="100" height="40" fill="#F8B66E"/>
        <!-- 右鳍/手臂 -->
        <rect x="800" y="615" width="80" height="60" fill="#F8B66E"/>
        <rect x="860" y="675" width="80" height="40" fill="#F8B66E"/>
        <rect x="900" y="715" width="40" height="40" fill="#F8B66E"/>

        <!-- 深橙描边（左侧暗面、底部阴影） -->
        <rect x="200" y="295" width="40" height="80" fill="#E89540"/>
        <rect x="180" y="375" width="60" height="80" fill="#E89540"/>
        <rect x="170" y="455" width="60" height="80" fill="#E89540"/>
        <rect x="170" y="535" width="40" height="80" fill="#E89540"/>
        <rect x="200" y="675" width="40" height="60" fill="#E89540"/>
        <rect x="60" y="775" width="60" height="60" fill="#E89540"/>
        <rect x="20" y="835" width="40" height="60" fill="#E89540"/>
        <rect x="100" y="895" width="40" height="40" fill="#E89540"/>
        <rect x="240" y="795" width="40" height="60" fill="#E89540"/>
        <rect x="220" y="735" width="40" height="60" fill="#E89540"/>

        <!-- 鳍刺（头上小刺） -->
        <rect x="430" y="135" width="80" height="20" fill="#F8B66E"/>
        <rect x="510" y="175" width="60" height="20" fill="#F8B66E"/>

        <!-- 左眼 -->
        <rect x="450" y="455" width="60" height="80" fill="#1a1a1a"/>
        <!-- 右眼 -->
        <rect x="630" y="455" width="60" height="80" fill="#1a1a1a"/>
        <!-- 嘴（小矩形） -->
        <rect x="550" y="535" width="40" height="20" fill="#1a1a1a"/>
        <!-- 左腮红 -->
        <rect x="370" y="535" width="80" height="60" fill="#F8C8B0"/>
        <!-- 右腮红 -->
        <rect x="690" y="535" width="80" height="60" fill="#F8C8B0"/>

        <!-- 肚子（浅色） -->
        <rect x="370" y="615" width="400" height="140" fill="#F5DAB5"/>
        <rect x="350" y="755" width="200" height="40" fill="#F5DAB5"/>
        <rect x="600" y="755" width="180" height="40" fill="#F5DAB5"/>
      </g>
    </symbol>

    <!-- 简化发光版小恐龙（用于亮背景） -->
    <symbol id="pixelDinoLight" viewBox="0 0 1100 1100">
      <g shape-rendering="crispEdges">
        <rect x="430" y="135" width="80" height="40" fill="#E89540"/>
        <rect x="510" y="175" width="60" height="40" fill="#E89540"/>
        <rect x="240" y="215" width="620" height="80" fill="#F8B66E"/>
        <rect x="200" y="295" width="700" height="80" fill="#F8B66E"/>
        <rect x="180" y="375" width="740" height="80" fill="#F8B66E"/>
        <rect x="170" y="455" width="760" height="80" fill="#F8B66E"/>
        <rect x="170" y="535" width="760" height="80" fill="#F8B66E"/>
        <rect x="180" y="615" width="740" height="60" fill="#F8B66E"/>
        <rect x="200" y="675" width="240" height="60" fill="#F8B66E"/>
        <rect x="700" y="675" width="220" height="60" fill="#F8B66E"/>
        <rect x="220" y="735" width="160" height="60" fill="#F8B66E"/>
        <rect x="740" y="735" width="160" height="60" fill="#F8B66E"/>
        <rect x="240" y="795" width="120" height="60" fill="#F8B66E"/>
        <rect x="780" y="795" width="80" height="60" fill="#F8B66E"/>
        <rect x="60" y="775" width="120" height="60" fill="#F8B66E"/>
        <rect x="20" y="835" width="120" height="60" fill="#F8B66E"/>
        <rect x="100" y="895" width="120" height="40" fill="#F8B66E"/>
        <rect x="20" y="935" width="100" height="40" fill="#F8B66E"/>
        <rect x="800" y="615" width="80" height="60" fill="#F8B66E"/>
        <rect x="860" y="675" width="80" height="40" fill="#F8B66E"/>
        <rect x="900" y="715" width="40" height="40" fill="#F8B66E"/>
        <rect x="200" y="295" width="40" height="80" fill="#E89540"/>
        <rect x="180" y="375" width="60" height="80" fill="#E89540"/>
        <rect x="170" y="455" width="60" height="80" fill="#E89540"/>
        <rect x="170" y="535" width="40" height="80" fill="#E89540"/>
        <rect x="200" y="675" width="40" height="60" fill="#E89540"/>
        <rect x="60" y="775" width="60" height="60" fill="#E89540"/>
        <rect x="20" y="835" width="40" height="60" fill="#E89540"/>
        <rect x="100" y="895" width="40" height="40" fill="#E89540"/>
        <rect x="240" y="795" width="40" height="60" fill="#E89540"/>
        <rect x="220" y="735" width="40" height="60" fill="#E89540"/>
        <rect x="430" y="135" width="80" height="20" fill="#F8B66E"/>
        <rect x="510" y="175" width="60" height="20" fill="#F8B66E"/>
        <rect x="450" y="455" width="60" height="80" fill="#1a1a1a"/>
        <rect x="630" y="455" width="60" height="80" fill="#1a1a1a"/>
        <rect x="550" y="535" width="40" height="20" fill="#1a1a1a"/>
        <rect x="370" y="535" width="80" height="60" fill="#F8C8B0"/>
        <rect x="690" y="535" width="80" height="60" fill="#F8C8B0"/>
        <rect x="370" y="615" width="400" height="140" fill="#F5DAB5"/>
        <rect x="350" y="755" width="200" height="40" fill="#F5DAB5"/>
        <rect x="600" y="755" width="180" height="40" fill="#F5DAB5"/>
      </g>
    </symbol>
  </defs>

  <!-- 背景 -->
  <rect width="1800" height="760" fill="url(#bgGrad)"/>

  <!-- 顶部标题 -->
  <text x="60" y="60" font-size="24" font-weight="700" fill="#1d1d1f">灵动岛 · AI 对话样式重设计</text>
  <text x="60" y="88" font-size="14" fill="#86868b">参考 Xiyue 设计风格文档（DESIGN_STYLE_GUIDE.md） ·  玻璃面板 + 主题蓝 + 像素小恐龙</text>

  <!-- 分割线 -->
  <line x1="60" y1="120" x2="1740" y2="120" stroke="rgba(0,0,0,.08)" stroke-width="1"/>

  <!-- ============== 左侧：浅色版本（替代原浅色截图） ============== -->
  <g transform="translate(60, 170)">
    <text font-size="16" font-weight="600" fill="#1d1d1f">① 浅色玻璃版本（桌面浅色背景）</text>
    <text y="22" font-size="12" fill="#86868b">毛玻璃 + 主题蓝边框 + 像素小恐龙吉祥物</text>

    <!-- 浅色玻璃岛主体（模拟手机顶部灵动岛形态） -->
    <g transform="translate(0, 60)" filter="url(#softShadow)">
      <!-- 玻璃岛 -->
      <rect x="0" y="0" width="820" height="180" rx="44" ry="44" fill="url(#glassSurface)" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
      <!-- 主题蓝外发光 -->
      <rect x="0" y="0" width="820" height="180" rx="44" ry="44" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.7"/>
      <!-- 内部高光（顶部薄薄一层） -->
      <rect x="2" y="2" width="816" height="40" rx="42" ry="42" fill="rgba(255,255,255,.55)"/>

      <!-- 左侧装饰点列（5 个圆点：iOS 灵动岛左舷小圆点装饰） -->
      <g transform="translate(30, 50)">
        <circle cx="6" cy="14" r="6" fill="rgba(0,0,0,.18)"/>
        <circle cx="6" cy="40" r="6" fill="rgba(0,0,0,.18)"/>
        <circle cx="6" cy="66" r="8" fill="#1d1d1f"/>
        <circle cx="6" cy="92" r="6" fill="rgba(0,0,0,.18)"/>
        <circle cx="6" cy="118" r="6" fill="rgba(0,0,0,.18)"/>
      </g>

      <!-- 中间：小恐龙吉祥物 + AI 对话文字 -->
      <g transform="translate(120, 18)">
        <!-- 蓝色背景胶囊 -->
        <rect x="0" y="0" width="100" height="140" rx="22" ry="22" fill="url(#accentGrad)"/>
        <!-- 顶部光晕 -->
        <rect x="2" y="2" width="96" height="32" rx="20" ry="20" fill="rgba(255,255,255,.35)"/>
        <!-- 小恐龙 (使用浅背景适配版) -->
        <use href="#pixelDinoLight" x="-3" y="-18" width="106" height="146"/>
        <!-- 文字"AI 对话"在底部 -->
        <text x="50" y="118" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">AI 对话</text>
      </g>

      <!-- 右侧文字区 -->
      <g transform="translate(250, 50)">
        <text font-size="22" font-weight="600" fill="#1d1d1f">你好，我是小恐龙</text>
        <text y="34" font-size="16" fill="rgba(29,29,31,.6)">你的 AI 助手 · 已就绪</text>
        <g transform="translate(0, 60)">
          <!-- 小徽标 -->
          <rect width="80" height="26" rx="13" ry="13" fill="rgba(64,156,255,.16)" stroke="rgba(64,156,255,.4)" stroke-width="1"/>
          <text x="40" y="18" font-size="12" font-weight="500" fill="#2f7fe6" text-anchor="middle">在线</text>
          <rect x="92" width="100" height="26" rx="13" ry="13" fill="rgba(48,164,108,.16)" stroke="rgba(48,164,108,.4)" stroke-width="1"/>
          <text x="142" y="18" font-size="12" font-weight="500" fill="#1f7a4d" text-anchor="middle">语音可用</text>
          <rect x="204" width="90" height="26" rx="13" ry="13" fill="rgba(255,82,82,.14)" stroke="rgba(255,82,82,.4)" stroke-width="1"/>
          <text x="249" y="18" font-size="12" font-weight="500" fill="#cc2f2f" text-anchor="middle">GPT-4o</text>
        </g>
      </g>

      <!-- 右侧：关闭按钮 -->
      <g transform="translate(770, 30)">
        <circle cx="0" cy="0" r="16" fill="rgba(0,0,0,.06)"/>
        <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" stroke="rgba(0,0,0,.5)" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 底部提示文字 -->
    <g transform="translate(0, 280)">
      <text x="410" font-size="16" font-weight="500" fill="#1d1d1f" text-anchor="middle">点击进入对话，或语音交谈</text>
    </g>

    <!-- 底部 home indicator -->
    <g transform="translate(310, 320)">
      <rect width="200" height="6" rx="3" ry="3" fill="rgba(0,0,0,.25)"/>
    </g>

    <!-- 标签 -->
    <text y="380" font-size="11" fill="#86868b">原浅色卡片版已重做：玻璃 + 主蓝 + 像素角色；问题：原版"AI 对话"文字被浅蓝图标压住几乎不可读</text>
  </g>

  <!-- ============== 中间：深色玻璃版本（Xiyue 原生） ============== -->
  <g transform="translate(60, 580)">
    <text font-size="16" font-weight="600" fill="#1d1d1f">② 深色玻璃版本（Xiyue 原生深色）</text>
  </g>
  <!-- 把深色版本单独放在右边大片区域 -->
  <g transform="translate(940, 170)">
    <text font-size="16" font-weight="600" fill="#1d1d1f">③ 深色玻璃版本（Xiyue 原生）</text>
    <text y="22" font-size="12" fill="#86868b">深色面板 + 主题蓝发光 + 像素小恐龙，文字对比度高</text>

    <!-- 深色玻璃岛主体 -->
    <g transform="translate(0, 60)" filter="url(#bigShadow)">
      <!-- 玻璃岛 -->
      <rect x="0" y="0" width="820" height="180" rx="44" ry="44" fill="url(#darkGlass)" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
      <!-- 顶部高光 -->
      <rect x="2" y="2" width="816" height="40" rx="42" ry="42" fill="rgba(255,255,255,.06)"/>
      <!-- 底部主题蓝光晕（细微） -->
      <rect x="0" y="0" width="820" height="180" rx="44" ry="44" fill="url(#accentGlow)" opacity="0.5"/>

      <!-- 左侧装饰点列 -->
      <g transform="translate(30, 50)">
        <circle cx="6" cy="14" r="6" fill="rgba(255,255,255,.25)"/>
        <circle cx="6" cy="40" r="6" fill="rgba(255,255,255,.25)"/>
        <circle cx="6" cy="66" r="8" fill="#409cff"/>
        <circle cx="6" cy="66" r="8" fill="rgba(64,156,255,.4)"/>
        <circle cx="6" cy="92" r="6" fill="rgba(255,255,255,.25)"/>
        <circle cx="6" cy="118" r="6" fill="rgba(255,255,255,.25)"/>
      </g>

      <!-- 中间：蓝色光晕背景 + 恐龙 -->
      <g transform="translate(120, 18)">
        <!-- 背景光晕圆 -->
        <circle cx="50" cy="50" r="58" fill="url(#accentGlow)" opacity="1.2"/>
        <!-- 蓝色玻璃块 -->
        <rect x="0" y="0" width="100" height="140" rx="22" ry="22" fill="url(#accentGrad)" opacity="0.95"/>
        <!-- 顶部高光 -->
        <rect x="2" y="2" width="96" height="32" rx="20" ry="20" fill="rgba(255,255,255,.3)"/>
        <!-- 小恐龙 -->
        <use href="#pixelDino" x="-3" y="-18" width="106" height="146"/>
        <!-- 文字 -->
        <text x="50" y="118" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">AI 对话</text>
      </g>

      <!-- 右侧文字 -->
      <g transform="translate(250, 50)">
        <text font-size="22" font-weight="600" fill="rgba(255,255,255,.95)">你好，我是小恐龙</text>
        <text y="34" font-size="16" fill="rgba(255,255,255,.62)">你的 AI 助手 · 已就绪</text>
        <g transform="translate(0, 60)">
          <rect width="80" height="26" rx="13" ry="13" fill="rgba(64,156,255,.22)" stroke="rgba(64,156,255,.55)" stroke-width="1"/>
          <text x="40" y="18" font-size="12" font-weight="500" fill="#9ecbff" text-anchor="middle">在线</text>
          <rect x="92" width="100" height="26" rx="13" ry="13" fill="rgba(48,164,108,.22)" stroke="rgba(48,164,108,.55)" stroke-width="1"/>
          <text x="142" y="18" font-size="12" font-weight="500" fill="#7ed4a4" text-anchor="middle">语音可用</text>
          <rect x="204" width="90" height="26" rx="13" ry="13" fill="rgba(255,82,82,.22)" stroke="rgba(255,82,82,.55)" stroke-width="1"/>
          <text x="249" y="18" font-size="12" font-weight="500" fill="#ff8b8b" text-anchor="middle">GPT-4o</text>
        </g>
      </g>

      <!-- 关闭按钮 -->
      <g transform="translate(770, 30)">
        <circle cx="0" cy="0" r="16" fill="rgba(255,255,255,.1)"/>
        <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" stroke="rgba(255,255,255,.7)" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 底部提示 -->
    <g transform="translate(0, 280)">
      <text x="410" font-size="16" font-weight="500" fill="#1d1d1f" text-anchor="middle">点击进入对话，或语音交谈</text>
    </g>

    <!-- home indicator -->
    <g transform="translate(310, 320)">
      <rect width="200" height="6" rx="3" ry="3" fill="rgba(0,0,0,.25)"/>
    </g>

    <text y="380" font-size="11" fill="#86868b">Xiyue 原生深色玻璃版：emoji-free，所有元素对比度 ≥ 4.5:1，文字清晰</text>
  </g>

  <!-- 底部：设计要点 -->
  <g transform="translate(60, 580)">
    <text font-size="16" font-weight="600" fill="#1d1d1f">② 设计要点</text>
    <g transform="translate(0, 24)" font-size="13" fill="#1d1d1f">
      <text y="0">• 灵动岛壳：<tspan font-weight="600">500×100 胶囊</tspan>，圆角 44px，深色玻璃 + 主蓝细描边</text>
      <text y="22">• 左侧 5 点装饰：iOS 灵动岛语言（中间主蓝 + 上下半透明白）</text>
      <text y="44">• AI 角色：<tspan font-weight="600">像素小恐龙</tspan>（暖橙）— UI 冷、角色暖，冷暖对冲</text>
      <text y="66">• 文字层级：22px 主标题 / 16px 副标题 / 14px "AI 对话"徽章</text>
      <text y="88">• 状态徽标：在线（蓝）· 语音（绿）· 模型（红）— 主题色透明度 22%</text>
      <text y="110">• 关闭按钮：右上角胶囊 32×32，hover rgba 增亮</text>
      <text y="132">• 底部提示：14px 居中「点击进入对话，或语音交谈」</text>
      <text y="154">• home indicator：底部居中 200×6 圆角条，黑色 25%</text>
      <text y="176">• 入场动画：cubic-bezier(0.22, 1, 0.36, 1) 0.4s（Xiyue 通用）</text>
    </g>
  </g>

  <!-- 顶部小对比区 -->
  <g transform="translate(940, 60)">
    <rect width="820" height="50" rx="14" ry="14" fill="rgba(255,255,255,.6)" stroke="rgba(0,0,0,.08)"/>
    <text x="20" y="20" font-size="13" font-weight="600" fill="#1d1d1f">⚠ 原版问题</text>
    <text x="20" y="40" font-size="11" fill="#666">浅蓝图标块在白底上对比度低 · "AI 对话"文字被压在浅蓝图标下看不清 · 整张卡片信息密度太单薄</text>
  </g>
</svg>