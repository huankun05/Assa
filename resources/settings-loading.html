<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>汐月</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f4f6fa;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #6b7386;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid rgba(77, 159, 255, 0.2);
      border-top-color: #4d9fff;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label { font-size: 13px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="label">加载中…</div>
</body>
</html>
