<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 整体背景渐变：深紫到深蓝 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="45%" style="stop-color:#0d1b3e"/>
      <stop offset="55%" style="stop-color:#0a2540"/>
      <stop offset="100%" style="stop-color:#0d3a5c"/>
    </linearGradient>

    <!-- 月亮金色渐变 -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe680"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#f0a500"/>
    </linearGradient>

    <!-- 月光光晕 -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </radialGradient>

    <!-- 海面渐变 -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a7a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0d2840"/>
    </linearGradient>

    <!-- 月光倒影渐变 -->
    <linearGradient id="reflectionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </linearGradient>

    <!-- 海天过渡薄雾 -->
    <linearGradient id="horizonFog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6a8a;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#5a7a9a;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4a6a8a;stop-opacity:0"/>
    </linearGradient>

    <!-- 星星发光 -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角方形 -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bgGrad)"/>

  <!-- 星星（点状，不明显） -->
  <circle cx="620" cy="180" r="4" fill="#fff8dc" opacity="0.8" filter="url(#starGlow)"/>
  <circle cx="720" cy="220" r="3" fill="#fff8dc" opacity="0.6" filter="url(#starGlow)"/>
  <circle cx="800" cy="160" r="5" fill="#fff8dc" opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="680" cy="280" r="2.5" fill="#fff8dc" opacity="0.5"/>
  <circle cx="850" cy="260" r="3.5" fill="#fff8dc" opacity="0.7" filter="url(#starGlow)"/>
  <circle cx="560" cy="240" r="2" fill="#fff8dc" opacity="0.4"/>

  <!-- 月亮光晕 -->
  <ellipse cx="320" cy="300" rx="200" ry="200" fill="url(#moonGlow)"/>

  <!-- 金色弯月（左上角，大） -->
  <path d="M 380 160 A 180 180 0 1 0 380 520 A 140 140 0 1 1 380 160 Z" fill="url(#moonGrad)"/>

  <!-- 中部柔和云层（海天过渡用，不割裂） -->
  <ellipse cx="200" cy="500" rx="180" ry="40" fill="#3a5a7a" opacity="0.4"/>
  <ellipse cx="500" cy="510" rx="220" ry="35" fill="#4a6a8a" opacity="0.35"/>
  <ellipse cx="800" cy="495" rx="200" ry="38" fill="#3a5a7a" opacity="0.4"/>
  <ellipse cx="650" cy="520" rx="160" ry="30" fill="#5a7a9a" opacity="0.25"/>

  <!-- 海天过渡带（柔和融合，不割裂） -->
  <rect x="0" y="480" width="1024" height="80" fill="url(#horizonFog)"/>

  <!-- 海平面（平的，但用渐变柔和过渡） -->
  <rect x="0" y="520" width="1024" height="504" fill="url(#seaGrad)"/>

  <!-- 月光倒影（垂直光带） -->
  <ellipse cx="320" cy="540" rx="60" ry="20" fill="#ffd700" opacity="0.5"/>
  <rect x="290" y="540" width="60" height="300" fill="url(#reflectionGrad)" opacity="0.4"/>

  <!-- 波浪线（平海面上的柔和波浪） -->
  <path d="M 0 600 Q 150 585 300 600 T 600 600 T 900 600 T 1024 600" stroke="#5ab0ff" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 0 660 Q 200 645 400 660 T 800 660 T 1024 660" stroke="#4a9eff" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 0 730 Q 180 715 360 730 T 720 730 T 1024 730" stroke="#3a8eef" stroke-width="5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M 0 800 Q 250 785 500 800 T 1000 800 T 1024 800" stroke="#2d7dd2" stroke-width="4" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- 倒影上的波光 -->
  <ellipse cx="310" cy="620" rx="30" ry="6" fill="#ffe680" opacity="0.4"/>
  <ellipse cx="330" cy="680" rx="25" ry="5" fill="#ffe680" opacity="0.35"/>
  <ellipse cx="305" cy="740" rx="20" ry="4" fill="#ffe680" opacity="0.3"/>
  <ellipse cx="325" cy="800" rx="15" ry="3" fill="#ffe680" opacity="0.25"/>
</svg>
